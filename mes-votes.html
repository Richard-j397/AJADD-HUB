<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mes votes - AJADD HUB</title>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f5f7;
            color: #222;
        }

        header {
            background: #071a3d;
            color: white;
            padding: 18px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #d4af37;
            font-size: 26px;
            font-weight: bold;
        }

        .retour {
            background: #d4af37;
            color: #071a3d;
            padding: 10px 16px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 35px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: #071a3d;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        .vide {
            background: #f8f8f8;
            border-radius: 12px;
            padding: 35px 20px;
            text-align: center;
        }

        .icone {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .vide h2 {
            color: #071a3d;
            margin-bottom: 10px;
        }

        .vide p {
            color: #666;
            line-height: 1.5;
        }

        .bouton {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 22px;
            background: #071a3d;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .bouton:hover {
            background: #0b285c;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 550px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            .box {
                padding: 22px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        AJADD HUB
    </div>

    <a
        href="dashboard.html"
        class="retour"
    >
        ← Dashboard
    </a>

</header>


<main class="container">

    <div class="box">

        <h1>
            🗳️ Mes votes
        </h1>

        <p class="description">
            Retrouvez ici l'historique de vos votes
            effectués sur AJADD HUB.
        </p>


        <div class="vide">

            <div class="icone">
                🗳️
            </div>

            <h2>
                Aucun vote enregistré
            </h2>

            <p>
                Votre historique de votes apparaîtra
                automatiquement ici après votre
                participation à un vote.
            </p>

            <a
                href="vote.html"
                class="bouton"
            >
                Voir les votes disponibles
            </a>

        </div>


        <div id="message"></div>

    </div>

</main>


<script>


/* ==============================
   CONNEXION À APPWRITE
============================== */

const client = new Appwrite.Client();

client
    .setEndpoint(
        "https://cloud.appwrite.io/v1"
    )
    .setProject(
        "6ac62abb001c74bb8de5"
    );


const account =
    new Appwrite.Account(client);


/* ==============================
   VÉRIFIER LA SESSION
============================== */

async function verifierConnexion() {

    try {

        const utilisateur =
            await account.get();

        console.log(
            "UTILISATEUR CONNECTÉ :",
            utilisateur
        );

    } catch (error) {

        console.error(
            "UTILISATEUR NON CONNECTÉ :",
            error
        );

        window.location.href =
            "Connexion.html";

    }

}


/* ==============================
   LANCER LA VÉRIFICATION
============================== */

verifierConnexion();


</script>

</body>

</html>
